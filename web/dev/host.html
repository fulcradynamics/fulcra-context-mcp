<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agents I Know — dev harness</title>
  <style>
    body { margin: 0; background: #0b0b0f; color: #9a9aa2; font-family: system-ui, sans-serif; }
    .bar { max-width: 440px; margin: 0 auto; padding: 10px 16px; font-size: 12px; line-height: 1.5; }
    .bar code { color: #c7c7cf; }
    .frame-wrap {
      position: relative; max-width: 1100px; margin: 8px auto 32px; height: 86vh;
      border: 1px solid #2a2a30; border-radius: 18px; overflow: hidden; background: #000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }
    iframe#app { width: 100%; height: 100%; border: 0; display: block; }
    /* Simulated ChatGPT composer so footer clearance can be eyeballed: a
       floating rounded input (~50px tall, ~550px wide, ~14px above the bottom
       edge). The 50px height + 14px gap match the bottom safe-area inset the
       mock host reports. */
    #composer {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      width: min(550px, calc(100% - 32px)); height: 50px; box-sizing: border-box;
      background: #2a2a2e; border: 1px solid #3a3a40; border-radius: 25px;
      display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px;
      color: #8e8e96; font-size: 15px; pointer-events: none;
    }
    #composer .plus { font-size: 22px; line-height: 1; color: #c7c7cf; }
    #composer .placeholder { flex: 1; }
    #composer .mic { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #8e8e96; box-sizing: border-box; }
    #composer .send { width: 34px; height: 34px; border-radius: 50%; background: #5a5a62; color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="bar">
    Dev harness — the <strong>real built UI</strong> (<code>contacts.html</code>) with mock data.
    Edit <code>web/</code> and it auto-rebuilds &amp; reloads. Mock data: <code>web/dev/mock-data.js</code>.
  </div>
  <div class="frame-wrap">
    <iframe id="app" sandbox="allow-scripts" title="Agents I Know"></iframe>
    <div id="composer" aria-hidden="true">
      <span class="plus">+</span>
      <span class="placeholder">Work with ChatGPT</span>
      <span class="mic"></span>
      <span class="send">↑</span>
    </div>
  </div>
  <script type="module" src="/host.js"></script>
  <script>try { new EventSource('/events').onmessage = () => location.reload(); } catch {}</script>
</body>
</html>
