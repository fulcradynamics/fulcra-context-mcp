<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agents I Know — dev harness</title>
  <style>
    body { margin: 0; background: #0b0b0f; color: #9a9aa2; font-family: system-ui, sans-serif; }
    .bar { max-width: 440px; margin: 0 auto; padding: 10px 16px; font-size: 12px; line-height: 1.5; }
    .bar code { color: #c7c7cf; }
    .frame-wrap {
      position: relative; max-width: 440px; margin: 8px auto 32px; height: 86vh;
      border: 1px solid #2a2a30; border-radius: 18px; overflow: hidden; background: #000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }
    iframe#app { width: 100%; height: 100%; border: 0; display: block; }
    /* Simulated ChatGPT composer so footer clearance can be eyeballed. Its
       height matches the bottom safe-area inset reported by the mock host. */
    #composer {
      position: absolute; left: 0; right: 0; bottom: 0; height: 56px;
      background: #1d1d22; border-top: 1px solid #2a2a30;
      display: flex; align-items: center; padding: 0 16px; gap: 10px;
      color: #6f6f78; font-size: 14px; pointer-events: none;
    }
    #composer .pill { flex: 1; height: 34px; border-radius: 18px; background: #0b0b0f; border: 1px solid #2a2a30; display: flex; align-items: center; padding: 0 14px; }
  </style>
</head>
<body>
  <div class="bar">
    Dev harness — the <strong>real built UI</strong> (<code>contacts.html</code>) with mock data.
    Edit <code>web/</code> and it auto-rebuilds &amp; reloads. Mock data: <code>web/dev/mock-data.js</code>.
  </div>
  <div class="frame-wrap">
    <iframe id="app" sandbox="allow-scripts" title="Agents I Know"></iframe>
    <div id="composer" aria-hidden="true"><span class="pill">Simulated host composer</span></div>
  </div>
  <script type="module" src="/host.js"></script>
  <script>try { new EventSource('/events').onmessage = () => location.reload(); } catch {}</script>
</body>
</html>
