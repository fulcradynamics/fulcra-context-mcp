[project]
name = "fulcra-context-mcp"
version = "1.18.3"
description = "Fulcra Context MCP Server"
license = "Apache-2.0"
authors = [
    {name = "Brandon Creighton", email = "brandon@fulcradynamics.com"},
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "fastmcp>=3.3.0,<4",
    "fulcra-api>=0.1.53",
    "google-cloud-storage>=2.18",
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.3",
    "openpyxl>=3.1",
    "structlog>=25.4.0",
]

[tool.uv]
exclude-newer = "2 weeks"
exclude-newer-package = { fulcra = false, fulcra-api = false, fulcra-data-types = false }

[dependency-groups]
dev = [
    "promql-parser>=0.10.0",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"



[project.scripts]
fulcra-context-mcp = "fulcra_mcp.main:main"

[tool.setuptools.packages.find]
include = ["fulcra_mcp*"]

[tool.setuptools.package-data]
fulcra_mcp = ["ui/*.html", "static/icon.png", "static/menu-*.svg", "static/*.json", "static/.well-known/*.json"]
