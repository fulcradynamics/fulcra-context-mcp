[project]
name = "fulcra-context-mcp"
version = "0.1.9"
description = "Fulcra Context MCP Server"
license = "Apache-2.0"
authors = [
    {name = "Brandon Creighton", email = "brandon@fulcradynamics.com"},
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "fastmcp>=3.0.0,<4",
    "fulcra-api>=0.1.38",
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.3",
    "structlog>=25.4.0",
]

[tool.uv]
exclude-newer = "2 weeks"
exclude-newer-package = { fulcra = false, fulcra-api = false, fulcra-data-types = false }
# fulcra-api mis-declares pytest<8 as a runtime dependency but never imports it;
# override so the dev group can track current pytest.
override-dependencies = ["pytest>=8"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"



[project.scripts]
fulcra-context-mcp = "fulcra_mcp.main:main"
