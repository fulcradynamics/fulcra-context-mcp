name: release

# Publishes whatever on main isn't published yet:
#   - pyproject.toml's version, if PyPI doesn't have it: test, build, upload
#     (Trusted Publishing), then tag and create a GitHub release;
#   - server.json's version, if the MCP Registry doesn't have it: wait for
#     PyPI, check the listed URLs, then publish to the registry.
# A release is a PR that runs `scripts/release.py bump`; merging it publishes.
# Pushes that change neither version do nothing. Run it by hand to retry.
# See docs/registry-publishing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish_pypi: ${{ steps.plan.outputs.publish_pypi }}
      publish_registry: ${{ steps.plan.outputs.publish_registry }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python3 scripts/release.py plan >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.publish_pypi == 'true'
    uses: ./.github/workflows/test.yml

  pypi:
    needs: [plan, test]
    if: needs.plan.outputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # tag and GitHub release
      id-token: write # PyPI Trusted Publishing
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
      - name: Tag and create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${VERSION}" dist/*
          --target "${GITHUB_SHA}" --title "v${VERSION}" --generate-notes

  registry:
    needs: [plan, pypi]
    # Runs after a successful PyPI release, or on its own when only server.json
    # changed. Never after a failed or cancelled PyPI release.
    if: >
      always() && needs.plan.outputs.publish_registry == 'true' &&
      (needs.pypi.result == 'success' ||
       (needs.plan.outputs.publish_pypi != 'true' && needs.pypi.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PyPI to serve the release
        run: python3 scripts/release.py wait-pypi
      - name: Check the URLs server.json lists
        run: python3 scripts/release.py check-urls
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Log in to the registry (DNS proof for fulcradynamics.com)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain fulcradynamics.com --private-key "${MCP_PRIVATE_KEY}"
      - name: Publish to the registry
        run: ./mcp-publisher publish
      - name: Confirm the registry lists it as latest
        run: python3 scripts/release.py verify-registry
      - name: Log out
        if: always()
        run: ./mcp-publisher logout || true
